# cpanel-mail-mcp (fork ruralhackers) — conector IMAP multicuenta para Langdock.
#
#   cp .env.example .env   # y rellena MCP_USERS_KEY, MCP_PUBLIC_URL, MCP_SIGNUP_CODE
#   docker compose up -d --build
#   curl -s 127.0.0.1:8080/health    # -> ok
#
# Detrás de un proxy HTTPS sin buffering (MCP usa SSE). Alta manual de un usuario:
#   docker compose exec cpanel-mail-mcp cpanel-mail-mcp admin add-user --email X --host mail.X
services:
  cpanel-mail-mcp:
    build: .
    image: cpanel-mail-mcp:0.8.0
    restart: unless-stopped
    environment:
      # Cifra las contraseñas de users.json. Si se pierde, todos repiten el alta.
      MCP_USERS_KEY: ${MCP_USERS_KEY:?set MCP_USERS_KEY (see README)}
      # URL pública, la que se muestra en la página de alta.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL, e.g. https://imap-mcp.tudominio.com}
      # Código del curso; vacío = /alta desactivada.
      MCP_SIGNUP_CODE: ${MCP_SIGNUP_CODE:-}
      # Opcional: exige params.confirm=<código> en los envíos.
      EMAIL_SEND_CONFIRMATION_CODE: ${EMAIL_SEND_CONFIRMATION_CODE:-}
      MCP_DEFAULT_TIMEZONE: ${MCP_DEFAULT_TIMEZONE:-Europe/Madrid}
    volumes:
      - mail-mcp-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mail-mcp-data:
